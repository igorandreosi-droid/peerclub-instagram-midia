name: Publicar fila do Instagram

# Roda a cada 15 minutos (o GitHub pode atrasar alguns minutos) e publica o que já venceu na pasta fila/.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      so_verificar:
        description: "Só conferir o token (não publica)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar-fila
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Conferir o token
        if: inputs.so_verificar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_HOST: ${{ secrets.IG_HOST }}
          SO_VERIFICAR: "1"
        run: python3 .github/scripts/publicar_fila.py

      - name: Ver se há algo vencido
        id: checar
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, pathlib
          from datetime import datetime, timezone
          agora = datetime.now(timezone.utc)
          n = 0
          for a in pathlib.Path("fila").glob("*.json"):
              f = pathlib.Path("fila/feito") / a.name
              if f.exists() and json.loads(f.read_text(encoding="utf-8")).get("status") != "erro_temporario":
                  continue
              if datetime.fromisoformat(json.loads(a.read_text(encoding="utf-8"))["publicar_em"]) <= agora:
                  n += 1
          print(f"vencidos={n}")
          EOF

      - name: Publicar
        if: steps.checar.outputs.vencidos != '0'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_HOST: ${{ secrets.IG_HOST }}
        run: python3 .github/scripts/publicar_fila.py

      - name: Gravar resultado
        if: always() && steps.checar.outputs.vencidos != '0'
        run: |
          git config user.name "fila-instagram"
          git config user.email "fila-instagram@users.noreply.github.com"
          git add fila/feito
          if ! git diff --cached --quiet; then
            git commit -m "Resultado da fila do Instagram"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi
